<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080a0c" />
    <script>
      (() => {
        let theme = 'dark';
        try {
          const savedTheme = localStorage.getItem('portfolio-theme');
          if (savedTheme === 'light' || savedTheme === 'dark') theme = savedTheme;
        } catch { /* Keep the default dark theme when storage is unavailable. */ }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'light' ? '#f7f9fc' : '#080a0c';
      })();
    </script>
    <meta name="description" content="Satyam Singh is a React Native engineer building resilient, high-performance mobile products for commerce, enterprise, and operational teams." />
